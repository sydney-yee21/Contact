Contact
- navigation bar (Home, About, Projects (dropdown menu), Resume, and Contact)
- desk picture on the left
- lists address, linkedin, phone number, and email

<!DOCTYPE html>
<html lang="EN-CA">
  <head>
    <title> Home </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-sale=1.0, width=device-width">

    <!-- 
Code copied from: https://www.w3schools.com/css/tryit.aspfilename=trycss_dropdown_navbar2

Author: W3Schools 

Name: CSS Dropdowns 

Description: Demonstrates how to create a navigation bar along with a dropdown menu 

Date retrieved: Wednesday, November 12, 2025
-->

    <style>
      html {
        font-size: 16px;
        /* change ems */
      }

      body {
        margin: 0;
        padding: 0;
      }

      ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: white;
        height: 80px;
        display: flex;
        align-items: center;
      }

      li {
        margin: auto;
      }

      li.logo {
        margin-right: auto;
      }

      li a,
      .dropbtn {
        display: inline-block;
        color: rgb(146, 110, 79);
        text-align: center;
        padding: 20px 10px;
        text-decoration: none;
      }
         
      p {
        font-size: .8em;
        text-align: left;
        display: block;
      }
      
   .info-item p,
.info-item a {
  font-size: 1.2em;
  line-height: 1.5;
  margin: 0;
}

      li.dropdown {
        display: inline-block;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        z-index: 1;
        top: 50px;
      }

      .dropdown-content a {
        color: rgb(146, 110, 79);
        padding: 20px 10px;
        text-decoration: none;
        display: block;
        text-align: left;
      }


      li a:hover,
      .dropdown:hover .dropbtn {
        background-color: #f9f9f9;
        color: brown;
      }

      .dropdown-content a:hover {
        background-color: #f1f1f1;
        color: brown;
      }
      

      .dropdown:hover .dropdown-content {
        display: block;
      }

      .overlay {
        position: relative;
        text-align: center;
        color: white;
      }

      .centered {
        position: absolute;
        top: 75%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      mark {
        background-color: rgb(248, 247, 246);
        padding: 20px;
        display: inline-block;
        width: 500px;
        height: 1em;
        border-radius: 10px;
      }

      .content {
        width: 100%;
        display: flex;
        overflow: hidden;
        clear: both;
      }

      .fullwidth {
        width: 100%;
        display: block;
        clear: both;
        margin: 0;
        margin-top: 2em;
        height: auto;
      }
      
      
      h1, h2 {
        text-align: center;
      }
      
      
      .contact-section {
  width: 100%;
  display: flex;
  min-height: 600px; /* Minimum height */
  margin: 0;
  padding: 0;
}

.contact-left {
  width: 50%;
  overflow: hidden;
  margin: 0;
  padding: 0;
}

.contact-left img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.contact-right {
  width: 50%;
  background-color: white;
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 0;
}

.contact-right h1 {
  font-size: 4em;
  font-weight: 300;
  letter-spacing: 0.1em;
  margin: 0;
  color: black;
  background-color: rgb(240, 235, 230); 
  padding: 20% 8%; 
  width: 100%; 
  text-align: center;
}

.contact-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 80px;
  width: 100%;
  padding: 20% 8%; 
  box-sizing: border-box;
  flex: 1;
  align-items: center;
}

.info-item {
  display: flex;
  flex-direction: row;
  align-items: center;
  text-align: left;
  gap: 20px;
  justify-content: center;
}

.icon {
  width: 60px;
  height: 60px;
  object-fit: contain;
}

.info-link {
  text-decoration: underline;
  color: black;
}

.info-link:hover {
  opacity: 0.7;
}
    </style>
  </head>
  <body>
    <ul>
      <li class="logo"><a href="https://sydney-yee21.github.io/Home/"><img src="Logo.png" alt="Sydney Yee" style="width:120px; height:50px;"></a></li>
      <li><a href="https://sydney-yee21.github.io/Home/">Home</a></li>
      <li><a href="https://sydney-yee21.github.io/About/">About</a></li>
      <li class="dropdown">
        <a href="javascript:void(0)" class="dropbtn"><b>Projects</b></a>
        <div class="dropdown-content">
          <a href="https://sydney-yee21.github.io/Videography/">Videography</a>
          <a href="https://sydney-yee21.github.io/Service-Design/">Service Design</a>
          <a href="#"><b>Website Redesign</b></a>
        </div>
      </li>
      <li><a href="https://sydney-yee21.github.io/Resume/">Resume</a></li>
      <li><a href="#home">Contact</a></li>
    </ul>
    
    <div class="contact-section">
  <div class="contact-left">
    <img src="desk.png" alt="Workspace with window view">
  </div>
  
   <div class="contact-right">
  <h1>CONTACT ME</h1>
  
  <div class="contact-info">
    <div class="info-item">
      <img src="address.png" alt="Address icon" class="icon">
      <div class="info-text">
        <p>58 Bastedo Avenue <br> Toronto, ON</p>
      </div>
    </div>
    
    <div class="info-item">
      <img src="phone.png" alt="Phone icon" class="icon">
      <p>647-877-9248</p>
    </div>
    
    <div class="info-item">
  <img src="linkedin.png" alt="LinkedIn icon" class="icon">
  <a href="https://www.linkedin.com/in/sydney-yee21/" class="info-link" target="_blank">LinkedIn</a>
</div>

<div class="info-item">
  <img src="email.png" alt="Email icon" class="icon">
  <a href="mailto:sydney.yee21@gmail.com" class="info-link" target="_blank">sydney.yee21@gmail.com</a>
</div>
  </div>
</div>
  </div>
  </body>
</html>
